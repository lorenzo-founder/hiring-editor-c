<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>We're Hiring — Video Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #000000;
      --surface2: #111111;
      --border: #1f1f1f;
      --text: #ffffff;
      --muted: #777777;
      --green1: #22c55e;
      --green2: #16a34a;
      --green3: #4ade80;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle 200px at 50% 82%, rgba(34,197,94,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: clamp(32px, 4.5vw, 68px);
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .hero-sub {
      font-size: 15px;
      font-weight: 400;
      color: var(--muted);
      max-width: 680px;
      line-height: 1.65;
      margin-bottom: 24px;
    }

    /* VIDEO */
    .video-section {
      width: 100%;
      max-width: 660px;
      margin: 0 auto 20px;
      padding: 0 16px;
    }

    .video-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      text-align: center;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface2);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .play-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .video-placeholder p {
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    /* CTA */
    .cta-wrap {
      display: flex;
      justify-content: center;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 320px;
      padding: 18px 52px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(90deg, #0f5c2a 0%, #4ade80 100%);
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 28px rgba(34,197,94,0.22);
    }

    .cta-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #0f5c2a;
      opacity: 0;
      transition: opacity 0.35s ease;
      border-radius: inherit;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 44px rgba(34,197,94,0.38);
    }

    .cta-btn:hover::before { opacity: 1; }
    .cta-btn:active { transform: translateY(0); }

    .cta-btn span {
      position: relative;
      z-index: 1;
    }

    @media (max-width: 600px) {
      html, body { overflow: auto; }
      .hero { height: auto; padding: 60px 20px; }
      .cta-btn { min-width: 260px; }
      .hero-sub { font-size: 14px; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <p class="hero-eyebrow">Open Position</p>
    <h1 class="hero-title">We're looking for a<br>Video Editor</h1>
    <div class="video-section">
      <p class="video-label">A Spich from Lorenzo, Founder</p>
      <div class="video-wrapper">
        <video controls playsinline style="width:100%;height:100%;object-fit:cover;">
          <source src="video.mp4" type="video/mp4">
        </video>
      </div>
    </div>

    <div class="cta-wrap">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdTjHMEV0sM9VUdJD49-I1kftFp4oONP_zfeGULa0sU38XirQ/viewform?usp=publish-editor" class="cta-btn" target="_blank">
        <span>Go to the Application Form</span>
      </a>
    </div>
  </section>

</body>
</html>
